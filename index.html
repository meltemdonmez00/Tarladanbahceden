<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TarladanBahçeden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: kraft-paper ilan panosu. Slab başlıklar, krem zemin, toprak yeşili, ahşap tonları.
   Tek cesur öğe: pazar etiketi biçimli fiyat bandı. */
:root{
  --bg:#f3ecd9; --paper:#fbf7ec; --ink:#262016; --muted:#6a604d; --line:#ded2b6;
  --green:#2e5a3b; --green-d:#1d3d28; --green-t:#2e5a3b; --green-l:#dfead3; --on-green:#fff;
  --wood:#8c5b34; --wood-l:#ecd9bd; --wood-t:#7a4d2a;
  --warn-t:#9a4a10; --warn-l:#f7e2c9; --bad-t:#a2342a; --bad-l:#f6dad5; --ok-t:#276b3d; --ok-l:#d9ecd8;
  --wa:#12794a; --danger:#a2342a; --tag:#e9cf9b; --tag-ink:#3a2a10;
  --hero-a:#1d3d28; --hero-b:#33663f; --hero-ink:#f6f0de;
  --shadow:0 1px 0 rgba(60,40,10,.06),0 10px 26px rgba(60,40,10,.08);
  --head:'Zilla Slab',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140e; --paper:#1e1c14; --ink:#f0e9d6; --muted:#aaa089; --line:#37332a;
  --green:#3b7a4d; --green-d:#264f33; --green-t:#9bd5a8; --green-l:#243628;
  --wood:#c99a69; --wood-l:#33281c; --wood-t:#d9b083;
  --warn-t:#efa86d; --warn-l:#3a2a1b; --bad-t:#ee8b80; --bad-l:#3c2420; --ok-t:#8fd29e; --ok-l:#223a28;
  --wa:#1b8a55; --danger:#b64a3e; --tag:#b99556; --tag-ink:#1d1608;
  --hero-a:#13281a; --hero-b:#1f4a2c; --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15140e; --paper:#1e1c14; --ink:#f0e9d6; --muted:#aaa089; --line:#37332a;
  --green:#3b7a4d; --green-d:#264f33; --green-t:#9bd5a8; --green-l:#243628;
  --wood:#c99a69; --wood-l:#33281c; --wood-t:#d9b083;
  --warn-t:#efa86d; --warn-l:#3a2a1b; --bad-t:#ee8b80; --bad-l:#3c2420; --ok-t:#8fd29e; --ok-l:#223a28;
  --wa:#1b8a55; --danger:#b64a3e; --tag:#b99556; --tag-ink:#1d1608;
  --hero-a:#13281a; --hero-b:#1f4a2c; --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(1.7rem,5.4vw,2.6rem)} h2{font-size:clamp(1.3rem,3.6vw,1.75rem)} h3{font-size:1.05rem}
p{margin:0 0 .8em} a{color:inherit}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wood);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.sec{padding-block:28px}
.mt{color:var(--muted);font-size:.86rem}
.mt.s{font-size:.78rem}
.sel{user-select:all;-webkit-user-select:all}

/* demo şeridi + üst bar */
.demo{background:var(--green-d);color:#efe8d2;font-size:.8rem;padding-block:7px}
.demo .wrap{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--head);font-size:1.3rem;font-weight:600;color:var(--green-t)}
.logo b{font-weight:700;color:var(--wood-t)}
.logo svg{width:28px;height:28px;flex:none}
.hr{display:flex;align-items:center;gap:8px}
.burger{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.menu{border-top:1px solid var(--line);background:var(--paper);padding-block:10px 14px}
.menu .wrap{display:grid;gap:2px;grid-template-columns:1fr}
.menu a,.menu button{display:block;text-align:left;padding:10px 6px;border-radius:6px;text-decoration:none;background:none;border:0;cursor:pointer;font-weight:500}
.menu a:hover,.menu button:hover{background:var(--green-l)}
.menu .who{padding:8px 6px;color:var(--muted);font-size:.85rem}
@media(min-width:720px){.menu .wrap{grid-template-columns:repeat(3,1fr)}}
.long{display:none}@media(min-width:460px){.long{display:inline}}

/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1.5px solid var(--green);background:var(--green);color:var(--on-green);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--green-t);border-color:var(--green-t)}
.btn.wood{background:var(--wood);border-color:var(--wood);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{background:linear-gradient(165deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);padding-block:34px 38px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(233,207,155,.20),rgba(233,207,155,0) 68%)}
.hero .wrap{position:relative;z-index:1}
.hero h1{max-width:15ch;margin-bottom:12px}
.hero p.lead{max-width:46ch;color:#e6dec6;margin-bottom:22px}
.sbox{background:var(--paper);color:var(--ink);border-radius:10px;padding:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
@media(min-width:760px){.sbox{grid-template-columns:2.2fr 1.1fr 1.1fr auto;align-items:end}}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:.88rem;color:#e6dec6}
.hero-facts span::before{content:"";display:inline-block;width:8px;height:8px;background:var(--tag);margin-right:8px;transform:rotate(45deg)}

/* form elemanları */
.f{display:grid;gap:5px}
.f label,.lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.f .hint{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--green-t);outline:none;box-shadow:0 0 0 3px var(--green-l)}
.grid2{display:grid;gap:14px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;font-weight:500;color:var(--ink);font-size:.92rem}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.seg span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.seg input:checked+span{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg input:focus-visible+span{outline:3px solid var(--wood);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
.err{background:var(--bad-l);color:var(--bad-t);border-radius:8px;padding:10px 14px;font-size:.92rem;margin-bottom:12px}
.note{background:var(--warn-l);color:var(--warn-t);border-radius:8px;padding:10px 14px;font-size:.9rem}
.info{background:var(--green-l);color:var(--green-t);border-radius:8px;padding:10px 14px;font-size:.9rem}

/* kartlar + ilan ızgarası */
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.shead a{font-weight:600;color:var(--green-t)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;margin-inline:-2px}
.row .lc{flex:0 0 218px;scroll-snap-align:start}
.lc{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:8px;text-decoration:none;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.lc:hover{border-color:var(--wood)}
.ph{position:relative;aspect-ratio:4/3;background:var(--wood-l)}
.ph img{width:100%;height:100%;object-fit:cover}
.ptag{position:absolute;left:0;bottom:12px;background:var(--tag);color:var(--tag-ink);font-family:var(--head);font-weight:700;font-size:.98rem;padding:4px 12px 4px 18px;clip-path:polygon(0 50%,10px 0,100% 0,100% 100%,10px 100%);max-width:92%}
.vit{position:absolute;right:8px;top:8px;background:var(--green);color:var(--on-green);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:4px}
.lb{padding:11px 12px 13px;display:grid;gap:5px}
.lb h3{font-size:1rem}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:.72rem;font-weight:700;background:var(--green-l);color:var(--green-t)}
.badge.w{background:var(--wood-l);color:var(--wood-t)}
.badge.warn{background:var(--warn-l);color:var(--warn-t)}
.badge.ok{background:var(--ok-l);color:var(--ok-t)}
.badge.red{background:var(--bad-l);color:var(--bad-t)}
.badge.mute{background:var(--line);color:var(--muted)}

/* kategoriler */
.cats{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(min-width:700px){.cats{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.cat{display:grid;gap:2px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-decoration:none;position:relative;min-width:0}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px;background:var(--cc,var(--green))}
.cat{padding-left:20px}
.cat b{font-family:var(--head);font-size:1.02rem;line-height:1.2}
.cat:hover{border-color:var(--wood)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border:1.5px solid var(--wood);border-radius:99px;text-decoration:none;font-size:.9rem;color:var(--wood-t);font-weight:600}
.chip:hover{background:var(--wood-l)}

/* bantlar */
.band{background:var(--green-l)}
.cta{background:var(--green);color:var(--on-green);border-radius:10px;padding:24px 20px;display:grid;gap:14px}
.cta p{margin:0;color:#e4efe0;max-width:52ch}
.cta .btn{background:var(--tag);border-color:var(--tag);color:var(--tag-ink);justify-self:start}
@media(min-width:760px){.cta{grid-template-columns:1fr auto;align-items:center;padding:30px}}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{padding:16px;border-left:4px solid var(--wood);background:var(--paper);border-radius:0 8px 8px 0}
.step h3{margin-bottom:4px}

/* arama sayfası */
.layout{display:grid;gap:18px}
@media(min-width:900px){.layout{grid-template-columns:270px 1fr;align-items:start}}
.fbox summary{cursor:pointer;font-weight:700;font-family:var(--head);font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
.fbox summary::-webkit-details-marker{display:none}
.fbox form{display:grid;gap:12px;margin-top:12px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

/* detay */
.dgrid{display:grid;gap:22px}
@media(min-width:860px){.dgrid{grid-template-columns:1.15fr 1fr;align-items:start}}
.gal .main{position:relative;aspect-ratio:4/3;background:var(--wood-l);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.gal .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{flex:0 0 68px;height:52px;padding:0;border:2px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:none}
.thumbs img{width:100%;height:100%;object-fit:cover}
.bigprice{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--head);font-weight:700;font-size:1.6rem;padding:6px 20px 6px 26px;clip-path:polygon(0 50%,14px 0,100% 0,100% 100%,14px 100%);margin-block:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.contact{display:grid;gap:10px;margin:16px 0}
.phoneline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.seller{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.2rem;flex:none}

/* ilan formu */
.photoprev{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photoprev div{position:relative;width:84px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.photoprev img{width:100%;height:100%;object-fit:cover}
.photoprev button{position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.formgrid{display:grid;gap:16px}

/* liste satırları (ilanlarım, yönetim) */
.item{display:grid;gap:10px;padding:12px;margin-bottom:10px}
.item .top{display:flex;gap:12px;min-width:0}
.item .th{flex:0 0 74px;height:56px;border-radius:6px;object-fit:cover;background:var(--wood-l)}
.item .ib{min-width:0;flex:1;display:grid;gap:3px}
.item .acts{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs a{white-space:nowrap;padding:9px 14px;border-radius:8px 8px 0 0;text-decoration:none;font-weight:600;color:var(--muted)}
.tabs a.on{background:var(--green);color:var(--on-green)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px}
.stat{padding:14px}.stat b{display:block;font-family:var(--head);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bar2{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar2 i{display:block;height:12px;background:var(--green);border-radius:2px;min-width:2px}
.bar2 span{font-variant-numeric:tabular-nums}

/* sayfa/doc */
.doc{max-width:760px}
.doc h2{margin:22px 0 8px}.doc h3{margin:16px 0 6px}
.doc ul,.doc ol{padding-left:1.2em;margin:0 0 1em}
.doc details{border-bottom:1px solid var(--line);padding:10px 0}
.doc summary{cursor:pointer;font-weight:600}
.pg{padding-block:22px 40px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

/* altlık */
footer{background:var(--green-d);color:#d9d2bb;margin-top:30px;padding-block:28px}
footer a{color:#efe8d2;text-decoration:none;display:block;padding:4px 0}
footer a:hover{text-decoration:underline}
.fcols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
footer h4{color:var(--tag);margin-bottom:6px;font-size:1rem}
footer small{display:block;margin-top:18px;line-height:1.5;color:#bdb6a0}

/* modal, toast, çerez */
.mb{position:fixed;inset:0;background:rgba(15,12,6,.55);z-index:80;display:grid;place-items:center;padding:16px}
.md{background:var(--paper);border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.md h3{margin-bottom:10px}
.md form{display:grid;gap:12px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100% - 32px);font-size:.92rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cookie{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:.88rem}
.cookie p{margin:0;flex:1 1 280px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>

<body>
<div class="demo"><div class="wrap"><span>Demo sürümü: veriler yalnızca bu tarayıcıda tutulur. Doğrulama kodu ekranda gösterilir.</span><button type="button" data-act="reset">Demo verisini sıfırla</button></div></div>
<div id="hdr"></div>
<main id="app"></main>
<footer id="ftr"></footer>
<div id="cookie"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ================= Veri katmanı (gerçek sürümde REST API ile değişir) ================= */
const LS='tbd_demo_v2',VER=2;
const IL=['Adana','Adıyaman','Afyonkarahisar','Ağrı','Aksaray','Amasya','Ankara','Antalya','Ardahan','Artvin','Aydın','Balıkesir','Bartın','Batman','Bayburt','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Düzce','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkâri','Hatay','Iğdır','Isparta','İstanbul','İzmir','Kahramanmaraş','Karabük','Karaman','Kars','Kastamonu','Kayseri','Kırıkkale','Kırklareli','Kırşehir','Kilis','Kocaeli','Konya','Kütahya','Malatya','Manisa','Mardin','Mersin','Muğla','Muş','Nevşehir','Niğde','Ordu','Osmaniye','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Şanlıurfa','Şırnak','Tekirdağ','Tokat','Trabzon','Tunceli','Uşak','Van','Yalova','Yozgat','Zonguldak'];
const UNITS=['kg','adet','bağ','demet','paket','litre','kasa','çuval','kavanoz','kutu'];
const KIND={taze:'Taze',kuru:'Kuru',isl:'İşlenmiş'};

function runSearch(q){
  let r=DB.listings.filter(vis);
  if(q.satici)r=r.filter(l=>l.userId===q.satici);
  if(q.q){const toks=norm(q.q).split(/\s+/).filter(Boolean);
    r=r.filter(l=>{const hay=norm([l.title,l.desc,l.variety,l.il,l.ilce,l.sub,catName(l.cat)].join(' '));const words=hay.split(/[^a-z0-9]+/).filter(Boolean);
      return toks.every(t=>hay.includes(t)||(t.length>=5&&words.some(w=>Math.abs(w.length-t.length)<=1&&lev(w,t)<=1)))})}
  if(q.cat)r=r.filter(l=>l.cat===q.cat);
  if(q.il)r=r.filter(l=>l.il===q.il);
  if(q.ilce)r=r.filter(l=>norm(l.ilce).includes(norm(q.ilce)));
  if(q.min)r=r.filter(l=>l.priceMode==='fiyat'&&l.price>=+q.min);
  if(q.max)r=r.filter(l=>l.priceMode==='fiyat'&&l.price<=+q.max);
  if(q.durum)r=r.filter(l=>l.kind===q.durum);
  if(q.yet)r=r.filter(l=>q.yet==='doga'?l.origin==='doga':l.origin!=='doga');
  if(q.tes)r=r.filter(l=>l.delivery===q.tes);
  if(q.tarih)r=r.filter(l=>l.created>=Date.now()-(+q.tarih)*864e5);
  const s=q.sirala||'yeni';
  const price=l=>l.priceMode==='fiyat'?l.price:Infinity;
  if(s==='ucuz')r.sort((a,b)=>price(a)-price(b));
  else if(s==='pahali')r.sort((a,b)=>(price(b)===Infinity?-1:price(b))-(price(a)===Infinity?-1:price(a)));
  else if(s==='yakin'){const il=q.il||DB.myIl;r.sort((a,b)=>((b.il===il)-(a.il===il))||b.created-a.created)}
  else r.sort((a,b)=>b.created-a.created);
  return r;
}

function fileToDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const M=900;const s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ================= Render ================= */
function render(keep){
  menuOpen=false;closeModal();
  const h=cur();let html;
  if(h!=='giris')loginNext='ilanlarim';
  if(!h||h==='anasayfa')html=V.home();
  else if(h==='ilanlar')html=V.search();
  else if(h.startsWith('urun-'))html=V.detail(h.slice(5));
  else if(h==='giris')html=V.login();
  else if(h==='ilan-ver')html=V.form();
  else if(h.startsWith('duzenle-'))html=V.form(h.slice(8));
  else if(h==='ilanlarim')html=V.mine();
  else if(h.startsWith('yonetim'))html=V.admin(h.slice(8));
  else if(PAGES[h])html=V.page(h);
  else html=V.msg('Sayfa bulunamadı','Aradığınız sayfa yok. Ana sayfaya dönebilirsiniz.');
  const y=window.scrollY;
  $('#app').innerHTML=html;renderHeader();renderFooter();renderCookie();
  const fb=$('#fbox');if(fb&&window.innerWidth>=900)fb.setAttribute('open','');
  window.scrollTo(0,keep===true?y:0);
}
function rerender(){render(true)}

 copy(a){const v=a.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast('Numara kopyalandı')).catch(()=>toast('Numarayı elle seçip kopyalayın'))}catch(e){toast('Numarayı elle seçip kopyalayın')}},
 cookie(a){DB.cookie=a.dataset.v;save();renderCookie()},
 reset(){ask('Demo verisi sıfırlansın mı? Eklediğiniz ilanlar ve hesaplar silinir.',()=>{DB=seed();save();loginState=null;Q={};go('anasayfa');render();toast('Demo verisi sıfırlandı')},'Sıfırla')},
 logout(){DB.session=null;save();toast('Çıkış yapıldı');go('anasayfa');render()},
 'demo-admin'(){DB.session='u_admin';save();toast('Yönetici olarak giriş yapıldı');go('yonetim')},
 'demo-user'(){DB.session='u4';save();toast('Fatma Şahin olarak giriş yapıldı');go('ilanlarim')},
 loginback(){loginState=null;render()},
 report(a){const id=a.dataset.id;modal('<h3>İlanı şikâyet et</h3><form data-form="report"><input type="hidden" name="id" value="'+id+'"><div class="f"><label for="r-reason">Neden</label><select id="r-reason" name="reason">'+opts(REASONS)+'</select></div><div class="f"><label for="r-note">Açıklama</label><textarea id="r-note" name="note" placeholder="Ne gördüğünüzü kısaca yazın"></textarea></div><div class="f"><label for="r-phone">Telefonunuz (isteğe bağlı)</label><input id="r-phone" name="phone" type="tel"></div><div class="actions"><button class="btn ghost" type="button" data-act="close">Vazgeç</button><button class="btn" type="submit">Gönder</button></div></form>')},
 rmphoto(a){formPhotos.splice(+a.dataset.i,1);$('#photoprev').innerHTML=photoPrev()},
 'u-pasif'(a){const l=DB.listings.find(x=>x.id===a.dataset.id);if(l){l.status='pasif';save();toast('İlan yayından kaldırıldı');rerender()}},
 'u-publish'(a){const l=DB.listings.find(x=>x.id===a.dataset.id);if(l){l.status=(l.approved||!DB.settings.requireApproval)?'yayinda':'bekliyor';save();toast(l.status==='yayinda'?'İlan yeniden yayında':'İlan onaya gönderildi');rerender()}},
 'u-del'(a){const id=a.dataset.id;ask('Bu ilan kalıcı olarak silinsin mi?',()=>{DB.listings=DB.listings.filter(l=>l.id!==id);save();toast('İlan silindi');rerender()},'Sil')},
 'a-approve'(a){const l=DB.listings.find(x=>x.id===a.dataset.id);if(l){l.status='yayinda';l.approved=true;l.rejectReason='';save();toast('İlan yayına alındı');rerender()}},
 'a-reject'(a){modal('<h3>İlanı reddet</h3><form data-form="reject"><input type="hidden" name="id" value="'+a.dataset.id+'"><div class="f"><label for="rj-why">Ret nedeni (kullanıcıya gösterilir)</label><textarea id="rj-why" name="why" required></textarea></div><div class="actions"><button class="btn ghost" type="button" data-act="close">Vazgeç</button><button class="btn danger" type="submit">Reddet</button></div></form>')},
 'a-remove'(a){const l=DB.listings.find(x=>x.id===a.dataset.id);if(l){l.status='kaldirildi';l.featured=false;save();toast('İlan yayından kaldırıldı');rerender()}},
 'a-feat'(a){const l=DB.listings.find(x=>x.id===a.dataset.id);if(l){l.featured=!l.featured;save();rerender()}},
 'a-del'(a){const id=a.dataset.id;ask('Bu ilan kalıcı olarak silinsin mi?',()=>{DB.listings=DB.listings.filter(l=>l.id!==id);save();toast('İlan silindi');rerender()},'Sil')},
 'a-susp'(a){const u=U(a.dataset.id);if(u){u.suspended=!u.suspended;save();toast(u.suspended?'Hesap askıya alındı':'Hesap aktifleştirildi');rerender()}},
 'cat-new'(){catModal(null)},
 'cat-edit'(a){catModal(a.dataset.id)},
 'cat-toggle'(a){const c=catById(a.dataset.id);if(c){c.active=!c.active;save();rerender()}},
 'cat-up'(a){moveCat(a.dataset.id,-1)},
 'cat-down'(a){moveCat(a.dataset.id,1)}
};
function moveCat(id,d){const i=DB.cats.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=DB.cats.length)return;const t=DB.cats[i];DB.cats[i]=DB.cats[j];DB.cats[j]=t;save();rerender()}
function catModal(id){const c=id?catById(id):{id:'',name:'',subs:[],active:true};modal('<h3>'+(id?'Kategoriyi düzenle':'Kategori ekle')+'</h3><form data-form="cat"><input type="hidden" name="id" value="'+esc(c.id)+'"><div class="f"><label for="k-name">Kategori adı</label><input id="k-name" name="name" type="text" required value="'+esc(c.name)+'"></div><div class="f"><label for="k-subs">Alt kategoriler (virgülle ayırın)</label><input id="k-subs" name="subs" type="text" value="'+esc(c.subs.join(', '))+'"></div><label class="chk"><input type="checkbox" name="active"'+(c.active?' checked':'')+'><span>Aktif</span></label><div class="actions"><button class="btn ghost" type="button" data-act="close">Vazgeç</button><button class="btn" type="submit">Kaydet</button></div></form>')}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f)f(a,e)});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('#f-cat')){const c=catById(t.value);$('#f-sub').innerHTML=opts(c?c.subs:[],'','Seçiniz (isteğe bağlı)');$('#catwarn').innerHTML=WARN[t.value]?'<div class="note">'+WARN[t.value]+'</div>':''}
  if(t.matches('#f-deliv'))$('#cargobox').hidden=t.value!=='kargo';
  if(t.matches('#f-pm')){const p=$('#f-price');p.disabled=t.value!=='fiyat';if(t.value!=='fiyat')p.value=''}
  if(t.matches('[data-photos]')){
    const files=[...t.files];const room=5-formPhotos.length;
    if(files.length>room)toast('En fazla 5 fotoğraf eklenebilir.');
    for(const f of files.slice(0,Math.max(room,0))){try{formPhotos.push(await fileToDataURL(f))}catch(err){toast('Bir fotoğraf okunamadı.')}}
    t.value='';$('#photoprev').innerHTML=photoPrev();
  }
});

const FORMS={
 search(f,fd){Q={};for(const [k,v] of fd.entries()){if(v!=='')Q[k]=String(v)}if(Q.il){DB.myIl=Q.il;save()}go('ilanlar')},
 login1(f,fd){
  const p=normPhone(fd.get('phone'));if(!p){toast('Geçerli bir cep telefonu girin. Örn. 0532 111 22 33');return}
  const ex=DB.users.find(u=>u.phone===p);if(ex&&ex.suspended){toast('Bu hesap geçici olarak askıya alınmış.');return}
  loginState={phone:p,code:String(100000+Math.floor(Math.random()*900000)),isNew:!ex};render()},
 login2(f,fd){
  const S=loginState;if(!S)return;const err=$('#lerr');const bad=m=>{err.innerHTML='<div class="err">'+m+'</div>'};
  if(String(fd.get('code')).trim()!==S.code)return bad('Kod yanlış. Ekrandaki kodu girin.');
  let u=DB.users.find(x=>x.phone===S.phone);
  if(S.isNew){const name=String(fd.get('name')||'').trim();if(name.length<2)return bad('Ad soyad girin.');if(!fd.get('kvkk'))return bad('Devam etmek için metinleri kabul etmelisiniz.');
    u={id:uid('u'),name,phone:S.phone,role:'user',verified:true,suspended:false,created:Date.now()};DB.users.push(u)}
  DB.session=u.id;loginState=null;save();toast('Hoş geldiniz, '+u.name.split(' ')[0]);go(loginNext||'ilanlarim')},
 listing(f,fd){
  const u=me();if(!u)return;const errs=[];const g=k=>String(fd.get(k)||'').trim();
  const priceMode=g('priceMode'),price=parseFloat(g('price')),qty=parseFloat(g('qty')),phone=normPhone(g('phone'));
  if(g('title').length<3)errs.push('Ürün adını yazın.');
  if(g('desc').length<10)errs.push('Açıklamayı biraz daha ayrıntılı yazın.');
  if(priceMode==='fiyat'&&!(price>0))errs.push('Fiyat girin ve fiyat biriminin doğru olduğundan emin olun.');
  if(!(qty>0))errs.push('Mevcut miktarı girin.');
  if(!g('il'))errs.push('İl seçin.');
  if(!phone)errs.push('Geçerli bir cep telefonu girin.');
  if(!formPhotos.length)errs.push('En az bir ürün fotoğrafı ekleyin.');
  if(!fd.get('ack'))errs.push('Beyan kutusunu işaretleyin.');
  if(errs.length){$('#ferr').innerHTML='<div class="err"><b>İlan kaydedilemedi:</b><ul style="margin:6px 0 0;padding-left:1.2em">'+errs.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';$('#ferr').scrollIntoView({block:'center'});return}
  const base={title:g('title'),cat:g('cat'),sub:g('sub'),kind:g('kind')||'taze',origin:g('origin')||'bahce',desc:g('desc'),priceMode,price:priceMode==='fiyat'?price:0,unit:g('unit'),qty,il:g('il'),ilce:g('ilce'),phone,harvest:g('harvest'),delivery:g('delivery'),cargo:g('delivery')==='kargo'?g('cargo'):'',variety:g('variety'),note:g('note'),photos:formPhotos.slice()};
  const auto=!DB.settings.requireApproval||u.role==='admin';
  if(formEditId){const l=DB.listings.find(x=>x.id===formEditId);Object.assign(l,base);if(l.userId===u.id&&u.role!=='admin'){l.status=auto?'yayinda':'bekliyor';l.approved=auto;l.rejectReason=''}else if(l.status==='reddedildi'){l.status='bekliyor'}}
  else DB.listings.push(Object.assign({id:uid('l'),userId:u.id,featured:false,status:auto?'yayinda':'bekliyor',approved:auto,rejectReason:'',created:Date.now()},base));
  save();toast(auto?'İlan yayında':'İlanınız onay için gönderildi');go(u.role==='admin'&&formEditId?'yonetim-ilanlar':'ilanlarim')},
 report(f,fd){DB.complaints.push({id:uid('c'),listingId:fd.get('id'),reason:fd.get('reason'),note:String(fd.get('note')||'').trim(),phone:String(fd.get('phone')||'').trim(),status:'yeni',adminNote:'',created:Date.now(),actedAt:0});save();closeModal();toast('Şikâyetiniz yöneticilere iletildi')},
 reject(f,fd){const l=DB.listings.find(x=>x.id===fd.get('id'));if(l){l.status='reddedildi';l.approved=false;l.rejectReason=String(fd.get('why')).trim();save();closeModal();toast('İlan reddedildi');rerender()}},
 cmp(f,fd){const c=DB.complaints.find(x=>x.id===fd.get('id'));if(c){c.status=fd.get('status');c.adminNote=String(fd.get('note')||'').trim();c.actedAt=Date.now();save();toast('Şikâyet güncellendi');rerender()}},
 admfilter(f,fd){ADM={s:String(fd.get('s')||''),q:String(fd.get('q')||'')};rerender()},
 cat(f,fd){const name=String(fd.get('name')).trim(),subs=String(fd.get('subs')||'').split(',').map(s=>s.trim()).filter(Boolean),active=!!fd.get('active'),id=fd.get('id');
  if(id){const c=catById(id);Object.assign(c,{name,subs,active})}else DB.cats.push({id:norm(name).replace(/[^a-z0-9]+/g,'')+Math.random().toString(36).slice(2,5),name,subs,active});
  save();closeModal();toast('Kategori kaydedildi');rerender()},
 home(f,fd){const S=DB.settings;S.featuredCats=fd.getAll('fc');S.seasonTitle=String(fd.get('st')||'').trim()||'Bu mevsimde öne çıkanlar';S.seasonKeys=String(fd.get('sk')||'').trim();S.requireApproval=!!fd.get('ra');S.allowPriceOptions=!!fd.get('ap');save();toast('Ayarlar kaydedildi')}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f,new FormData(f))});

render();
})();
</script>
